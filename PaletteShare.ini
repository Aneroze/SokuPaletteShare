; PaletteShare settings

[Display]
; The PaletteShare version that last updated this file. Written by the mod.
IniVersion=1.1.0

; Show your opponent's custom palette (1) or always the normal palette for their slot (0).
; The hotkey below flips this at any time, even in the middle of a match.
ShowOpponentPalettes=1

[Picker]
; When a palette mod (e.g. a shady-loader package) replaces a character's normal palettes, also list
; the game's original colors for those slots ("Original 03"), usable like your own palettes (1 = on).
ShowOriginalPalettes=0

; The game button that changes the highlighted palette's fallback at character select: Switch (the
; card switch key, S by default), Spell (spell card, D by default), D (the dash/random key, A by
; default: that takes over the game's random deck there) or None.
FallbackButton=Switch

[Save]
; Save every custom palette an opponent plays with (1 = on, 0 = off), into one folder:
; <game folder>\PaletteShare\saved, as <character>-<profile>-NN.pal (e.g. udonge-Quosu-01.pal:
; the game's own character name, the opponent's profile name, and NN counts that player's palettes
; for that character). A palette already saved for that character and player isn't saved again.
; The files can be copied into palettes\<character> as they are.
AutoSave=1

[Replay]
; Save both sides' custom palettes with your replays (1 = on, 0 = off), in <replay name>.meta.json
; next to the .rep. Off: PaletteShare writes no .meta.json, and those replays play back with the
; normal palettes. Replays that already have one still play back with their palettes.
SaveMetadata=1

[Hotkey]
; Toggle the opponent's custom palette on/off. Virtual-key codes:
; https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
; Modifier=0x11 is Ctrl, Key=0x50 is P. Remove a line (or leave it empty) for none: without Key
; there's no hotkey at all, without Modifier the key works alone.
Modifier=0x11
Key=0x50
; Save the opponent's custom palette now (at character select or in a match), the same way
; AutoSave does: for when AutoSave is off. Off by default; remove the ';' in front of both lines
; for Ctrl+S.
;SaveModifier=0x11
;SaveKey=0x53

[Debug]
; Write PaletteShare.log next to the DLL (1 = on, 0 = off). The previous run's log is kept as
; PaletteShare.prev.log. It holds what helps with a bug report, including your opponents' IP
; addresses and ports; at most 2 MB per run.
Log=1
; Testing only (see the README): ForcePaletteLeft=<file> / ForcePaletteRight=<file> show a palette
; file on that side; HotkeyIgnoresFocus=1 lets the hotkey work without the game focused.
