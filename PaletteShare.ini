; PaletteShare settings

[Debug]
; Write PaletteShare.log next to the DLL (1 = on, 0 = off).
Log=1
; Force a palette from the cache on one side at character load: the 32-digit hash from the
; log / the file name in cache\ (without .pal). Left = player 1 side, Right = player 2 side.
; Empty = off. Only meant for testing the palette swap.
ForcePaletteLeft=
ForcePaletteRight=
