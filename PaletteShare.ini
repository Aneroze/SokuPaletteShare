; PaletteShare settings

[Display]
; Show your opponent's custom palette (1) or always the normal palette for their slot (0).
; The hotkey below flips this at any time, even in the middle of a match.
ShowOpponentPalettes=1

[Hotkey]
; Toggle the opponent's custom palette on/off. Virtual-key codes:
; https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
; Modifier=0x11 is Ctrl (0 = no modifier), Key=0x50 is P.
Modifier=0x11
Key=0x50

[Debug]
; Write PaletteShare.log next to the DLL (1 = on, 0 = off).
Log=0
